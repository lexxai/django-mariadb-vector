[project]
name = "django-mariadb-vector"
version = "0.1.2"
description = "Django ORM support for MariaDB Vector field (MariaDB 11.8.2+)"
authors = [{ name = "lexxai", email = "lexxai@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-django",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_mariadb_vector"]

[dependency-groups]
dev = []

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
